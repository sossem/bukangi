function buildChoice() {
  const C = CONTENT.choice, S = CONTENT.sim;
  $('#final-legend').innerHTML = fill(C.finalLegend);
  $('#final-options').innerHTML = SIM_KEYS.map((k) => {
    const c = S.scenarios[k];
    return `<label class="opt-card"><input class="vh-input" type="radio" name="final-choice" value="${k}"><span class="box"><span class="tick" aria-hidden="true"></span>`
      + `<span class="opt-icon">${ICONS[k]()}</span><span class="opt-main"><span class="opt-title">${esc(c.letter + ' ' + c.title)}</span><span class="opt-desc">${fill(c.desc)}</span></span></span></label>`;
  }).join('');
  $('#tags-legend').innerHTML = fill(C.tagsLegend);
  $('#tags-help').innerHTML = fill(C.tagsHelp);
  $('#tag-list').innerHTML = C.tags.map((t) => `<label class="chip"><input class="vh-input" type="checkbox" name="tags" value="${esc(t.id)}"><span class="pill">${esc(t.label)}</span></label>`).join('');
  $('#reason-label').innerHTML = fill(C.reasonLabel);
  $('#reason-help').innerHTML = fill(C.reasonHelp);
  $('#reason').placeholder = C.reasonPlaceholder;
  $('#frames').insertAdjacentHTML('beforeend', `<button type="button" class="frame-btn is-all" data-frame="all">${esc(C.frameAllLabel)}</button>`
    + C.frames.map((f, i) => `<button type="button" class="frame-btn" data-frame="${i}"></button>`).join(''));
  updateFrameLabels();
}
function frameText(i) {
  const C = CONTENT.choice;
  const choice = state.finalChoice ? CONTENT.sim.scenarios[state.finalChoice].short : '___';
  const one = (t) => stripTags(fill(t, { choice: choice }));
  return i === 'all' ? C.frames.map(one).join(' ') : one(C.frames[i]);
}
function updateFrameLabels() {
  $$('.frame-btn').forEach((b) => { if (b.dataset.frame !== 'all') b.textContent = '+ ' + frameText(Number(b.dataset.frame)); });
}
function insertFrame(text) {
  const ta = $('#reason');
  const s = typeof ta.selectionStart === 'number' ? ta.selectionStart : ta.value.length;
  const e = typeof ta.selectionEnd === 'number' ? ta.selectionEnd : s;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const sep = before && !/\s$/.test(before) ? ' ' : '';
  ta.value = before + sep + text + after;
  const insStart = before.length + sep.length;
  const k = ta.value.indexOf('___', insStart);
  ta.focus();
  if (k >= 0 && k < insStart + text.length) ta.setSelectionRange(k, k + 3);
  else ta.setSelectionRange(insStart + text.length, insStart + text.length);
  state.reason = ta.value;
  updateCounter();
  saveSoon();
}
function updateCounter() {
  const n = reasonLength(state.reason), min = CONTENT.rules.reasonMin, blanks = /_{3,}/.test(state.reason);
  $('#reason-counter').innerHTML = `<span>${n}자 / 최소 ${min}자</span>`
    + (blanks ? '<span class="need">빈칸(___)을 내 생각으로 바꿔 주세요</span>'
      : n >= min ? '<span class="ok">✓ 좋아요!</span>' : `<span class="need">${min - n}자 더 써 보세요</span>`);
}

let h2cPromise = null;
function loadHtml2canvas() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  if (!h2cPromise) {
    h2cPromise = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = H2C_URL;
      sc.async = true;
      sc.onload = () => (window.html2canvas ? resolve(window.html2canvas) : reject(new Error('html2canvas 없음')));
      sc.onerror = () => { h2cPromise = null; reject(new Error('불러오기 실패')); };
      document.head.appendChild(sc);
    });
  }
  return h2cPromise;
}
function triggerDownload(href, name) {
  try {
    const a = document.createElement('a');
    a.href = href; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    return true;
  } catch (e) { return false; }
}
function downloadBlob(blob, name) {
  try {
    if (window.navigator && window.navigator.msSaveOrOpenBlob) { window.navigator.msSaveOrOpenBlob(blob, name); return true; }
    const url = URL.createObjectURL(blob);
    const ok = triggerDownload(url, name);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return ok;
  } catch (e) { return false; }
}
async function saveImage() {
  const btn = $('#save-image'), txt = $('.btn-txt', btn);
  if (btn.disabled) return;
  btn.disabled = true;
  txt.textContent = '이미지 만드는 중…';
  try {
    const h2c = await loadHtml2canvas();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await h2c($('#activity-card'), {
      scale: 2, backgroundColor: '#fffaf1', useCORS: true, logging: false, windowWidth: 800,
      onclone: (doc) => { doc.documentElement.classList.add('capturing'); }
    });
    const url = canvas.toDataURL('image/png');
    const fname = `부캉이의바다_${(String(state.name || '').trim() || '활동카드').replace(/[\\/:*?"<>|\s]+/g, '_')}_${stamp().slice(0, 8)}.png`;
    $('#image-preview').src = url;
    const a = $('#image-download');
    a.href = url;
    a.setAttribute('download', fname);
    triggerDownload(url, fname);
    openModal('#image-modal', '#image-download');
  } catch (err) {
    toast('이미지를 만들지 못했어요. 인터넷 연결을 확인하거나 [텍스트 복사]를 이용해 주세요.');
  } finally {
    btn.disabled = false;
    txt.textContent = '이미지로 저장';
  }
}
function showText(title, desc, text) {
  $('#text-title').textContent = title;
  $('#text-desc').textContent = desc;
  $('#text-out').value = text;
  openModal('#text-modal', '#text-out');

async function copyText() {
  const text = cardText();
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
  } catch (e) { ok = false; }
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }

/* =====================================================================

const modalStack = [];
function focusables(root) {
  return $$('a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select, [tabindex]:not([tabindex="-1"])', root)
    .filter((el) => !el.closest('[hidden]') && (el.offsetWidth || el.offsetHeight || el.getClientRects().length));
}
function openModal(sel, focusSel, onClose) {
  const m = $(sel);
  if (!m || !m.hidden) return;
  m.hidden = false;
  modalStack.push({ m: m, ret: document.activeElement, onClose: onClose });
  document.body.classList.add('modal-open');
  const box = $('[role="dialog"], [role="alertdialog"]', m);
  const f = (focusSel && $(focusSel, m)) || focusables(box)[0] || box;
  setTimeout(() => { try { f.focus(); } catch (e) { /* 무시 */ } }, 30);
}
function closeModal(result) {
  const top = modalStack.pop();
  if (!top) return;
  top.m.hidden = true;
  if (!modalStack.length) document.body.classList.remove('modal-open');
  if (top.ret && document.contains(top.ret)) { try { top.ret.focus(); } catch (e) { /* 무시 */ } }
  if (top.onClose) top.onClose(result);
}
function confirmDialog(title, msg, yesLabel) {
  return new Promise((resolve) => {
    $('#confirm-title').textContent = title;
    $('#confirm-msg').textContent = msg;
    $('#confirm-yes').textContent = yesLabel || '확인';
    openModal('#confirm-modal', '#confirm-no', (r) => resolve(r === true));
  });
}

let teacherUnlocked = false;
function evaluate(rec) {
  const norm = (t) => String(t || '').replace(/\s+/g, '');
  const out = {};
  ['life', 'eco'].forEach((k) => {
    const cfg = CONTENT.evaluation[k], ev = [], extra = [];
    const scan = (txt) => {
      const n = norm(txt), hits = [], seen = [];
      cfg.keywords.forEach((w) => { const nw = norm(w); if (nw && n.indexOf(nw) >= 0 && seen.indexOf(nw) < 0) { seen.push(nw); hits.push(w); } });
      return hits.map((w) => `‘${w}’`).join(', ');
    };
    (cfg.tagIds || []).forEach((t) => { if ((rec.tags || []).indexOf(t) >= 0) ev.push(`태그 ‘${tagLabel(t)}’`); });
    const a = scan(rec.reason); if (a) ev.push('이유 글: ' + a);
    const b = scan(rec.tagEtc); if (b) ev.push('기타 태그: ' + b);
    const c = scan(rec.q2); if (c) extra.push('발문 2 답: ' + c);
    out[k] = { ok: ev.length > 0, evidence: ev, extra: extra };
  });
  return out;
}
function badgesHTML(ev) {
  return '<div class="badges">' + ['life', 'eco'].map((k) => {
    const b = CONTENT.evaluation[k].badge;
    return ev[k].ok ? `<span class="badge is-ok">[${esc(b)} ✔]</span>` : `<span class="badge is-no">${esc(b)} – 자동 감지 안 됨</span>`;
  }).join('') + '</div>';
}
function evidenceHTML(ev) {
  return ['life', 'eco'].map((k) => {
    const e = ev[k];
    if (!e.evidence.length && !e.extra.length) return '';
    return `<p class="evidence"><b>${esc(CONTENT.evaluation[k].badge)}</b> 근거: ${esc(e.evidence.join(' · ') || '없음')}`
      + (e.extra.length ? ` <span>(참고 — ${esc(e.extra.join(' · '))})</span>` : '') + '</p>';
  }).join('');
}

function csvCell(v) {

function exportCSV() {
  const recs = getRecords().slice().sort((a, b) => String(a.startedAt).localeCompare(String(b.startedAt)));
  if (!recs.length) { toast('내려받을 기록이 없어요.'); return; }
  const head = ['번호', '이름(번호)', '상태', '시작 시각', '마지막 저장 시각', '소요 시간(분)', '매립 전 감정', '매립 후 감정', '발문1 한 줄',
    '시뮬레이션 첫 선택', '살펴본 선택', '최종 선택', '고려한 것', '기타 내용', '나의 이유', '이유 글자 수', '발문2 답', '나의 다짐',
    '생명권 고려(자동)', '생태계 연결성 고려(자동)', '자동 표시 근거', '기록 ID'];
  const rows = recs.map((r, i) => {
    const ev = evaluate(r), eb = emoById(r.emoBefore), ea = emoById(r.emoAfter);
    const end = r.finishedAt || r.updatedAt;
    const mins = r.startedAt && end ? Math.max(0, Math.round((new Date(end) - new Date(r.startedAt)) / 6000) / 10) : '';
    const basis = ['life', 'eco'].map((k) => {
      const all = ev[k].evidence.concat(ev[k].extra.map((x) => '참고 ' + x));
      return all.length ? `${CONTENT.evaluation[k].badge}: ${all.join(' · ')}` : '';
    }).filter(Boolean).join(' / ');
    return [i + 1, r.name, statusText(r), fmtDate(r.startedAt, true), fmtDate(r.updatedAt, true), mins,
      eb ? eb.label : '', ea ? ea.label : '', r.q1, choiceName(r.simFirst), viewedText(r), choiceName(r.finalChoice),
      (r.tags || []).map(tagLabel).join('; '), r.tagEtc, r.reason, reasonLength(r.reason), r.q2, r.pledge,
      ev.life.ok ? 'O' : '', ev.eco.ok ? 'O' : '', basis, r.id];
  });
  const csv = '﻿' + [head].concat(rows).map((row) => row.map(csvCell).join(',')).join('\r\n');
  const ok = downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `부캉이의바다_응답_${stamp()}.csv`);
  if (ok) toast(`CSV 파일(${recs.length}건)을 내려받았어요.`);
  else showText('CSV 내용', '내려받기가 안 되면 아래 내용을 복사해 메모장에 붙여 넣고 .csv 파일로 저장하세요.', csv);

    });
  });
  $('#confirm-yes').addEventListener('click', () => closeModal(true));
  $('#confirm-no').addEventListener('click', () => closeModal(false));
  document.addEventListener('keydown', (e) => {
    if (!modalStack.length) return;
    const top = modalStack[modalStack.length - 1].m;
    if (e.key === 'Escape') { e.preventDefault(); closeModal(false); return; }
    if (e.key !== 'Tab') return;
    const f = focusables(top);

    if (!top.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  // 교사용
  $('#teacher-btn').addEventListener('click', () => {
    if (teacherUnlocked) { openTeacher(); return; }
    $('#pw-input').value = '';
    $('#pw-error').textContent = '';
    openModal('#pw-modal', '#pw-input');
  });
  $('#pw-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if ($('#pw-input').value === String(TEACHER_PASSWORD)) {
      teacherUnlocked = true;
      closeModal(true);
      openTeacher();
    } else {
      $('#pw-error').textContent = '비밀번호가 맞지 않아요.';
      $('#pw-input').select();
    }
  });
  $('.tabs').addEventListener('click', (e) => { const t = e.target.closest('[role="tab"]'); if (t) selectTab(t.id.replace('tab-', ''), true); });
  $('.tabs').addEventListener('keydown', (e) => {
    const names = ['guide', 'current', 'records'];
    const cur = names.indexOf(String(document.activeElement && document.activeElement.id).replace('tab-', ''));
    if (cur < 0) return;
    let n = null;
    if (e.key === 'ArrowRight') n = (cur + 1) % 3;
    if (e.key === 'ArrowLeft') n = (cur + 2) % 3;
    if (e.key === 'Home') n = 0;
    if (e.key === 'End') n = 2;
    if (n !== null) { e.preventDefault(); selectTab(names[n], true); }
  });
  $('#teacher-modal').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'csv') exportCSV();
    if (act === 'refresh') { saveNow(); renderRecords(); renderCurrent(); toast('기록을 새로 불러왔어요.'); }
    if (act === 'clear') {
      if (await confirmDialog('기록을 모두 지울까요?', '이 기기에 저장된 모든 학생 기록이 지워져요. 먼저 CSV로 내려받아 두는 것을 권해요. 지운 기록은 되살릴 수 없어요.', '모두 지우기')) {
        storage.remove(RECORDS_KEY);
        renderRecords();
        toast('저장된 기록을 모두 지웠어요.');
      }
    }
    if (act === 'new-student') {
      if (await confirmDialog('다음 학생을 시작할까요?', '지금 학생의 기록은 그대로 저장되고, 화면이 처음으로 돌아가요.', '새로 시작')) {
        closeModal(false);
        resetSession();
        toast('새 학생이 시작할 수 있어요.');
      }
    }
  });
  // 화면 크기·글꼴 변화
  window.addEventListener('resize', debounce(syncStoryHeight, 120));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncStoryHeight);
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(() => syncStoryHeight());
    $$('.slide').forEach((s) => ro.observe(s));
  }
  // 나갈 때 저장
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
}

/* =====================================================================
   시작
   ===================================================================== */
function init() {
  renderStaticTexts();
  renderSteps();
  buildStart();
  buildStory();
  buildQ1();
  buildSim();
  buildChoice();
  buildMeaning();
  bindEvents();
  applyStateToUI();
  goTo(state.screen, { animate: false, focus: false, scroll: false });
  if (!storageOK) setTimeout(() => toast('이 브라우저에서는 자동 저장이 되지 않아요. 새로고침하지 말고 이어서 해 주세요.'), 600);
}
init();
</script>
</body>
