<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="상어 부캉이의 눈으로 바다를 바라보고, 함께 사는 방법을 찾아보는 10분 탐구 활동">
<meta name="theme-color" content="#0b2545">
<title>부캉이의 바다</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
<style>
/* ================================================================
   글꼴 (눈누 CDN) — 제목: 강원교육튼튼 / 본문: 강원교육모두
   ================================================================ */
@font-face { font-family: 'GangwonEduPowerExtraBoldA';
  src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEduPowerExtraBoldA.woff') format('woff');
  font-weight: normal; font-display: swap; }
@font-face { font-family: 'GangwonEdu_OTFBoldA';
  src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff') format('woff');
  font-weight: 700; font-display: swap; }
@font-face { font-family: 'GangwonEdu_OTFLightA';
  src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFLightA.woff') format('woff');
  font-weight: 400; font-display: swap; }

/* ================================================================
   색과 공통 값
   ================================================================ */
:root {
  color-scheme: light;
  --font-title: 'GangwonEduPowerExtraBoldA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --font-body: 'GangwonEdu_OTFLightA', 'GangwonEdu_OTFBoldA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --font-bold: 'GangwonEdu_OTFBoldA', 'GangwonEdu_OTFLightA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;

  --navy-950: #061428;
  --navy-900: #081d38;
  --navy-800: #0b2545;
  --navy-700: #13315c;
  --navy-600: #1d4677;
  --teal-800: #0b5c5e;
  --teal-700: #0f6e70;
  --teal-600: #1f7f73;
  --teal-500: #2a9d8f;
  --teal-300: #7fd1c7;
  --teal-100: #dcf3ef;
  --sand-50:  #fffaf1;
  --sand-100: #fbf3e4;
  --sand-200: #f3e5c8;
  --sand-300: #e6cf9f;
  --coral-300: #f8b9a6;
  --coral-400: #f4977d;
  --coral-500: #f08a6c;
  --coral-600: #d9643f;
  --coral-700: #b8462a;
  --ink: #12253f;
  --ink-soft: #3c4f68;
  --ink-mute: #56677d;
  --line: #e4d6bb;
  --line-strong: #9c8a63;
  --paper: #fffaf1;
  --paper-2: #fbf3e4;
  --on-dark: #f7f4ec;
  --on-dark-soft: #c4d3e4;
  --focus: #b8462a;

  /* 시뮬레이션 게이지: 남색 바탕에서 색약 구분·대비 검증을 통과한 3색 */
  --g-safety: #e0663a;  --g-safety-track: #4a2c2c;
  --g-eco:    #1aa577;  --g-eco-track:    #0f3f3c;
  --g-shark:  #4a92ea;  --g-shark-track:  #1a3a63;

  --radius-lg: 24px;
  --radius-md: 16px;
  --shadow: 0 12px 32px rgba(3, 14, 30, .28);
  --shadow-soft: 0 4px 14px rgba(3, 14, 30, .14);
  --ease: cubic-bezier(.22, .8, .3, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 17px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--navy-900);
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
body.modal-open { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-title); font-weight: normal; font-synthesis: none; line-height: 1.3; letter-spacing: -0.01em; margin: 0; }
strong, b { font-family: var(--font-bold); font-weight: 700; }
p { margin: 0 0 .6em; }
p:last-child { margin-bottom: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.on-dark, .topbar, .screen-head, .screen-nav, .gauges, .start-hero, .meaning, .ac-head, .carousel-controls, .sim-note, .card-help { --focus: #ffd166; }

.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -80px; z-index: 300; background: #fff; color: var(--ink); padding: 10px 16px; border-radius: 10px; font-family: var(--font-bold); text-decoration: none; }
.skip-link:focus { top: 12px; }

/* ================================================================
   바다 배경
   ================================================================ */
.ocean { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(127, 209, 199, .32), transparent 70%),
    linear-gradient(180deg, #0f4766 0%, #0b3157 30%, #0a2446 62%, #061833 100%); }
.ocean .ray { position: absolute; top: -20%; width: 16vw; min-width: 90px; height: 130%;
  background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, 0) 75%);
  transform: rotate(14deg); transform-origin: top center; animation: ray 11s ease-in-out infinite alternate; }
.ocean .ob { position: absolute; bottom: -40px; border-radius: 50%;
  border: 2px solid rgba(220, 243, 239, .35); background: rgba(220, 243, 239, .06);
  animation: rise linear infinite; }
@keyframes ray { from { opacity: .5; transform: rotate(12deg); } to { opacity: 1; transform: rotate(17deg); } }
@keyframes rise { from { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } to { transform: translateY(-115vh); opacity: 0; } }

.app { overflow-x: clip; min-height: 100vh; }

/* ================================================================
   상단 진행 표시줄
   ================================================================ */
.topbar { position: sticky; top: 0; z-index: 40; color: var(--on-dark);
  background: rgba(8, 29, 56, .94); border-bottom: 1px solid rgba(127, 209, 199, .18);
  padding-top: env(safe-area-inset-top, 0px); box-shadow: 0 4px 18px rgba(3, 14, 30, .25); }
.topbar-inner { max-width: 1160px; margin: 0 auto; padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 6px; flex: none; }
.brand-logo { display: block; width: 40px; }
.brand-logo svg { display: block; width: 40px; height: auto; }
.brand-name { display: none; font-family: var(--font-title); font-size: 19px; white-space: nowrap; color: #fff3dc; }
.steps { flex: 1 1 auto; min-width: 0; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.step-btn { position: relative; width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 4px 6px; border-radius: 12px; border: 1px solid rgba(196, 211, 228, .28); background: rgba(255, 255, 255, .04);
  color: var(--on-dark-soft); cursor: pointer; text-align: left; transition: background-color .25s, border-color .25s, color .25s; }
.step-num { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  font-family: var(--font-bold); font-size: 16px; background: rgba(255, 255, 255, .1); }
.step-label { display: none; min-width: 0; line-height: 1.2; }
.step-name { display: block; font-family: var(--font-bold); font-size: 16px; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-time { display: block; font-size: 16px; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-btn.is-done { background: rgba(127, 209, 199, .14); border-color: rgba(127, 209, 199, .5); color: var(--on-dark); }
.step-btn.is-done .step-num { background: var(--teal-300); color: var(--navy-800); }
.step-btn.is-current { background: var(--coral-400); border-color: var(--coral-400); color: var(--ink); }
.step-btn.is-current .step-num { background: var(--ink); color: #fff; }
.step-btn[aria-disabled="true"] { cursor: not-allowed; }
.step-btn:not([aria-disabled="true"]):not(.is-current):hover { background: rgba(255, 255, 255, .12); }
.teacher-btn { flex: none; min-width: 44px; min-height: 44px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
  border: 1px solid rgba(196, 211, 228, .35); background: transparent; color: var(--on-dark-soft); font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.teacher-btn:hover { background: rgba(255, 255, 255, .1); color: var(--on-dark); }
.teacher-btn .t-txt { display: none; }
.progress-now { flex-basis: 100%; margin: 0; font-size: 16px; color: var(--on-dark-soft); line-height: 1.4; }
.progress-now b { color: var(--on-dark); }
.progress-track { height: 4px; background: rgba(255, 255, 255, .08); }
.progress-track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal-300), var(--coral-400)); transition: width .6s var(--ease); }

/* ================================================================
   공통 레이아웃과 부품
   ================================================================ */
main { max-width: 1160px; margin: 0 auto; padding: 18px 16px 56px; outline: none; }
.screen.is-entering { animation: screenIn .5s var(--ease) both; }
.screen.is-entering.from-back { animation-name: screenInBack; }
@keyframes screenIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes screenInBack { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

.screen-head { color: var(--on-dark); margin: 4px 0 16px; }
.screen-head h2 { font-size: clamp(28px, 5vw, 40px); color: #fff3dc; margin: 10px 0 6px; outline: none; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 4px 12px; border-radius: 999px;
  font-family: var(--font-bold); font-size: 16px; color: var(--teal-300); background: rgba(127, 209, 199, .12); }
.lead { margin: 0; color: var(--on-dark-soft); max-width: 62ch; }

.panel { background: var(--paper); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: clamp(16px, 3vw, 28px); }
.panel + .panel, .panel + .q-panel, .q-panel + .panel { margin-top: 16px; }
.block-title { display: block; font-family: var(--font-title); font-size: clamp(20px, 3vw, 26px); margin-bottom: 6px; padding: 0; }
.help { color: var(--ink-soft); margin: 0 0 10px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px;
  border-radius: 999px; border: 2px solid transparent; font-family: var(--font-bold); font-size: 17px; line-height: 1.25;
  text-align: center; text-decoration: none; cursor: pointer; transition: transform .15s, background-color .2s, box-shadow .2s, border-color .2s; }
.btn:active { transform: translateY(2px); }
.btn[disabled] { opacity: .65; cursor: progress; }
.btn-primary { font-family: var(--font-title); font-weight: normal; letter-spacing: .01em; background: var(--coral-500); color: var(--ink); box-shadow: 0 4px 0 #b9573c; }
.btn-primary:hover { background: #f49b80; }
.btn-primary:active { box-shadow: 0 2px 0 #b9573c; }
.btn-secondary { background: #fff; color: var(--teal-800); border-color: var(--teal-700); }
.btn-secondary:hover { background: var(--teal-100); }
.btn-light { background: var(--sand-100); color: var(--ink); border-color: var(--sand-300); }
.btn-light:hover { background: #fff; }
.btn-ghost-dark { background: rgba(255, 255, 255, .08); color: var(--on-dark); border-color: rgba(196, 211, 228, .45); }
.btn-ghost-dark:hover { background: rgba(255, 255, 255, .16); }
.btn-ghost-dark[aria-disabled="true"] { opacity: .45; cursor: default; }
.btn-lg { min-height: 56px; font-size: 20px; padding: 12px 28px; }
.btn-block { width: 100%; }
.btn-danger { background: #fff; color: #9b2c12; border-color: #c2410c; }
.btn-danger:hover { background: #fff1ea; }

.screen-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 22px; }
.screen-nav [data-next] { margin-left: auto; }
.nav-hint { flex-basis: 100%; margin: 0; min-height: 0; color: #ffd9cc; font-family: var(--font-bold); text-align: right; }
.nav-hint:empty { display: none; }

.field { display: grid; gap: 6px; margin-top: 16px; }
.field > label, .label { font-family: var(--font-bold); }
.opt { font-family: var(--font-body); color: var(--ink-soft); }
.input, .textarea { width: 100%; min-height: 50px; padding: 12px 14px; border: 2px solid var(--line-strong); border-radius: 14px;
  background: #fff; color: var(--ink); font-size: 17px; line-height: 1.55; transition: border-color .2s, box-shadow .2s; }
.textarea { min-height: 140px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: #6b7787; opacity: 1; }
.input:focus, .textarea:focus { outline: none; border-color: var(--teal-700); box-shadow: 0 0 0 4px rgba(15, 110, 112, .25); }
.is-invalid { border-color: var(--coral-700) !important; box-shadow: 0 0 0 4px rgba(184, 70, 42, .18) !important; }

/* 라디오·체크박스 카드 */
.vh-input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.emo-grid { display: grid; gap: 18px; }
.emo-legend { font-family: var(--font-bold); margin-bottom: 8px; }
.emo-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.emo-opt { position: relative; display: block; }
.emo-opt .face { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 76px; padding: 8px 4px;
  border-radius: 16px; border: 2px solid var(--line); background: #fff; cursor: pointer; text-align: center; transition: border-color .2s, background-color .2s, transform .2s; }
.emo-opt .emo { font-size: 30px; line-height: 1.1; }
.emo-opt .emo-txt { font-size: 16px; }
.emo-opt:hover .face { border-color: var(--line-strong); }
.emo-opt input:checked + .face { border-color: var(--coral-700); background: #fff1ea; box-shadow: inset 0 0 0 1px var(--coral-700); transform: translateY(-2px); }
.emo-opt input:checked + .face .emo-txt { font-family: var(--font-bold); }
.emo-opt input:focus-visible + .face { outline: 3px solid var(--focus); outline-offset: 3px; }

.opt-grid { display: grid; gap: 10px; }
.opt-card { position: relative; display: block; }
.opt-card .box { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; border-radius: 16px;
  border: 2px solid var(--line-strong); background: #fff; cursor: pointer; transition: border-color .2s, background-color .2s; }
.opt-card .box:hover { background: #fffdf8; }
.opt-card .tick { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); background: #fff; }
.opt-card .tick::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: transparent; }
.opt-card input:checked + .box { border-color: var(--coral-700); background: #fff1ea; box-shadow: inset 0 0 0 1px var(--coral-700); }
.opt-card input:checked + .box .tick { border-color: var(--coral-700); }
.opt-card input:checked + .box .tick::after { background: var(--coral-700); }
.opt-card input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 3px; }
.opt-card .opt-icon { flex: none; width: 64px; }
.opt-card .opt-icon svg { display: block; width: 64px; height: auto; }
.opt-card .opt-main { display: grid; gap: 2px; }
.opt-card .opt-title { font-family: var(--font-title); font-size: 20px; }
.opt-card .opt-desc { color: var(--ink-soft); font-size: 16px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-block; }
.chip .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 8px 16px; border-radius: 999px;
  border: 2px solid var(--line-strong); background: #fff; cursor: pointer; transition: background-color .2s, color .2s, border-color .2s; }
.chip .pill::before { content: '+'; font-family: var(--font-bold); color: var(--teal-700); }
.chip:hover .pill { background: #f6fbfa; }
.chip input:checked + .pill { background: var(--teal-700); border-color: var(--teal-700); color: #fff; font-family: var(--font-bold); }
.chip input:checked + .pill::before { content: '✓'; color: #fff; }
.chip input:focus-visible + .pill { outline: 3px solid var(--focus); outline-offset: 3px; }

/* 발문 */
.q-panel { border: 3px solid var(--sand-300); }
.q-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
  background: var(--navy-800); color: #fff; font-family: var(--font-bold); font-size: 16px; }
.q-title { font-size: clamp(21px, 3.4vw, 28px); margin: 10px 0 16px; }

/* ================================================================
   0단계: 시작
   ================================================================ */
.start { display: grid; gap: 22px; align-items: center; padding-top: 8px; }
.start-hero { text-align: center; color: var(--on-dark); }
.start-bk { position: relative; width: min(330px, 74vw); margin: 0 auto; }
.start-bk svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .28)); }
.start-title { font-size: clamp(46px, 11vw, 84px); color: #fff3dc; margin: 4px 0 10px; text-shadow: 0 5px 0 rgba(3, 14, 30, .35); outline: none; }
.start-sub { font-size: clamp(18px, 2.8vw, 23px); color: var(--on-dark-soft); max-width: 24em; margin: 0 auto; }
.start-panel h2 { font-size: 22px; margin-bottom: 4px; }
.start-meta { margin: 14px 0 0; color: var(--ink-soft); }
.start-steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; counter-reset: st; }
.start-steps li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--paper-2); counter-increment: st; }
.start-steps li::before { content: counter(st); flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--teal-700); color: #fff; font-family: var(--font-bold); font-size: 16px; }
.start-steps .s-name { flex: 1; font-family: var(--font-bold); }
.start-steps .s-time { color: var(--ink-soft); white-space: nowrap; }
.start-actions { display: grid; gap: 10px; margin-top: 16px; }
.link-btn { justify-self: center; min-height: 44px; padding: 6px 12px; border: 0; background: none; color: var(--teal-800); text-decoration: underline; cursor: pointer; font-family: var(--font-bold); }

/* ================================================================
   1단계: 이야기 카드 + 비교 슬라이더
   ================================================================ */
.carousel { position: relative; }
.carousel-viewport { position: relative; overflow: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow); background: var(--paper);
  touch-action: pan-y; transition: height .45s var(--ease); }
.carousel-track { display: flex; align-items: flex-start; transition: transform .55s var(--ease); }
.carousel-track.is-dragging { transition: none; user-select: none; -webkit-user-select: none; }
.slide { flex: 0 0 100%; min-width: 0; background: var(--paper); }
.slide:not(.is-active) * { animation-play-state: paused !important; }
.slide-scene { position: relative; background: #bfe6ef; overflow: hidden; }
.slide-scene > svg { display: block; width: 100%; height: auto; }
.slide-body { padding: 18px 18px 22px; }
.slide-tag { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--teal-100); color: var(--teal-800); font-family: var(--font-bold); font-size: 16px; }
.slide-title { font-size: clamp(23px, 3.6vw, 31px); margin: 10px 0 12px; }
.speech { position: relative; background: #fff; border: 2px solid var(--sand-200); border-radius: 18px; padding: 14px 16px; }
.speech-who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-family: var(--font-bold); }
.speech-who small { font-family: var(--font-body); font-size: 16px; color: var(--ink-soft); }
.bk-mini { display: block; width: 66px; height: auto; flex: none; }
.mood-chip { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 16px; font-family: var(--font-bold); background: var(--sand-100); color: var(--ink-soft); border: 1px solid var(--sand-300); }

.carousel-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.dots { order: -1; flex-basis: 100%; display: flex; justify-content: center; gap: 2px; }
.dot { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 10px; }
.dot::before { content: ''; width: 12px; height: 12px; border-radius: 6px; background: rgba(196, 211, 228, .5); transition: width .3s, background-color .3s; }
.dot.is-seen::before { background: var(--teal-300); }
.dot[aria-current="true"]::before { width: 30px; background: var(--coral-400); }

.compare-layout { display: grid; gap: 16px; padding: 16px; }
.compare { position: relative; border-radius: 18px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; background: #bfe6ef; --pos: 50%; }
.compare-after > svg { display: block; width: 100%; height: auto; }
.compare-before { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos)) 0 0); -webkit-clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.compare-before > svg { display: block; width: 100%; height: 100%; }
.compare-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 0 1px rgba(11, 37, 69, .35); pointer-events: none; }
.compare-handle { position: absolute; top: 50%; left: var(--pos); width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
  display: grid; place-items: center; background: var(--coral-500); border: 4px solid #fff; box-shadow: 0 4px 14px rgba(3, 14, 30, .35);
  color: var(--ink); cursor: grab; touch-action: none; }
.compare-handle:active { cursor: grabbing; }
.compare-handle svg { width: 34px; height: 20px; }
.compare-handle:focus-visible { outline: 4px solid #ffd166; outline-offset: 3px; }
.compare-tag { position: absolute; top: 10px; padding: 4px 12px; border-radius: 999px; background: rgba(11, 37, 69, .86); color: #fff; font-family: var(--font-bold); font-size: 16px; pointer-events: none; }
.compare-tag--before { left: 10px; }
.compare-tag--after { right: 10px; }
.compare-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 4px 14px; border-radius: 999px; background: rgba(255, 250, 241, .95); color: var(--ink); font-family: var(--font-bold); font-size: 16px; white-space: nowrap; pointer-events: none; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% + 8px)); } }
.compare-side .slide-title { margin-top: 8px; }
.compare-guide { color: var(--ink-soft); }
.compare-who { display: flex; gap: 10px; align-items: center; margin: 10px 0 14px; padding: 10px 12px; border-radius: 16px; background: #fff; border: 2px solid var(--sand-200); }
.compare-who p { margin: 0; }
.indicators { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ind { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.ind-label { font-family: var(--font-bold); }
.ind-word { font-family: var(--font-bold); color: var(--teal-800); min-width: 3em; text-align: right; }
.ind-bar { grid-column: 1 / -1; height: 12px; border-radius: 999px; background: #d3ece8; overflow: hidden; }
.ind-bar i { display: block; height: 100%; width: 50%; border-radius: inherit; background: var(--teal-600); }
.ind-scale { display: flex; justify-content: space-between; font-size: 16px; color: var(--ink-mute); margin-top: 8px; }

/* ================================================================
   2단계: 시뮬레이션
   ================================================================ */
.situation { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.situation-bk svg { display: block; width: 96px; height: auto; }
.situation-tag { display: inline-block; margin: 0 0 4px; padding: 2px 12px; border-radius: 999px; background: #fff1ea; color: #8f3418; font-family: var(--font-bold); font-size: 16px; }
.situation h3 { font-size: clamp(20px, 3.2vw, 27px); margin-bottom: 6px; }
.situation p { color: var(--ink-soft); }

.choices { display: grid; gap: 14px; margin-top: 16px; }
.choice { position: relative; display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: start; width: 100%; padding: 18px; text-align: left;
  background: var(--paper); color: var(--ink); border: 3px solid transparent; border-radius: var(--radius-lg); box-shadow: var(--shadow);
  cursor: pointer; transition: transform .2s, border-color .2s, box-shadow .2s; }
.choice:hover { transform: translateY(-3px); }
.choice.is-selected { border-color: var(--coral-500); box-shadow: 0 0 0 4px rgba(240, 138, 108, .35), var(--shadow); }
.choice-head { margin: 0; }
.choice-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 46px; margin-top: 12px; padding: 8px 16px; border-radius: 999px;
  border: 2px solid var(--coral-700); background: #fff; color: #8f3418; font-family: var(--font-bold); cursor: pointer; text-align: left; }
.choice-btn::after { content: ''; position: absolute; inset: 0; border-radius: var(--radius-lg); }
.choice-btn:focus-visible { outline: none; }
.choice-btn:focus-visible::after { box-shadow: 0 0 0 4px #ffd166; }
.choice.is-selected .choice-btn { background: var(--coral-500); border-color: var(--coral-500); color: var(--ink); }
.choice-icon svg { display: block; width: 76px; height: auto; }
.choice-letter { display: inline-grid; place-items: center; width: 34px; height: 34px; margin-right: 6px; border-radius: 50%; background: var(--navy-800); color: #fff; font-family: var(--font-title); font-size: 18px; vertical-align: middle; }
.choice-title { font-size: clamp(22px, 3.2vw, 27px); display: inline; vertical-align: middle; }
.choice-desc { margin: 8px 0 6px; }
.choice ul { margin: 0; padding-left: 1.15em; color: var(--ink-soft); }
.choice-focus { margin: 8px 0 0; padding: 6px 10px; border-radius: 10px; background: var(--paper-2); font-size: 16px; color: var(--ink-soft); }
.choice-cta { display: inline-block; margin-top: 10px; font-family: var(--font-bold); color: var(--coral-700); }
.choice-seen { display: inline-block; margin: 0 0 6px; padding: 2px 10px; border-radius: 999px; background: var(--teal-100); color: var(--teal-800); font-family: var(--font-bold); font-size: 16px; }

.sim { margin-top: 18px; }
.sim-panel { background: var(--paper); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.sim-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.sim-title { font-size: clamp(20px, 3vw, 26px); outline: none; }
.sim-controls { display: flex; gap: 6px; }
.icon-btn { width: 48px; height: 48px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 2px solid var(--teal-700);
  background: #fff; color: var(--teal-800); cursor: pointer; font-size: 18px; line-height: 1; transition: background-color .2s; }
.icon-btn:hover { background: var(--teal-100); }
.icon-btn.is-primary { background: var(--teal-700); color: #fff; }
.years { list-style: none; margin: 0; padding: 0 18px 12px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.year-btn { position: relative; overflow: hidden; width: 100%; min-height: 44px; padding: 4px 2px; border-radius: 12px; border: 2px solid var(--line);
  background: #fff; color: var(--ink-soft); font-family: var(--font-bold); font-size: 16px; cursor: pointer; white-space: nowrap; }
.year-btn.is-done { border-color: var(--teal-500); color: var(--teal-800); }
.year-btn[aria-current="step"] { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }
.year-btn .yp { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--coral-500); }
.sim-body { display: grid; gap: 14px; padding: 0 18px 18px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "scene" "gauges" "event" "chain"; align-items: start; }
.sim-scene { grid-area: scene; position: relative; border-radius: 18px; overflow: hidden; background: #2c95a8; }
.sim-scene > svg { display: block; width: 100%; height: auto; }
.sim-stamp { position: absolute; bottom: 10px; left: 10px; padding: 3px 14px; border-radius: 999px; background: rgba(11, 37, 69, .88); color: #fff; font-family: var(--font-title); font-size: 20px; pointer-events: none; }
.si { transition: opacity .9s ease; }
.si.off { opacity: 0; }
.sim-event { grid-area: event; background: var(--paper-2); border: 2px solid var(--sand-200); border-radius: 16px; padding: 14px 16px; }
.sim-event h4 { font-size: 21px; margin-bottom: 6px; }
.sim-event .ev-text { margin: 0; }
.sim-event.is-new { animation: evIn .5s var(--ease); }
@keyframes evIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.voice { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 0; }
.voice-who { flex: none; padding: 2px 10px; border-radius: 999px; background: var(--teal-100); color: var(--teal-800); font-family: var(--font-bold); font-size: 16px; }
.voice q { quotes: '“' '”'; }

.chain-box { grid-area: chain; background: #f1f8f6; border: 2px solid #cfe5df; border-radius: 18px; padding: 14px; min-width: 0; align-self: start; }
.chain-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 10px; margin-bottom: 6px; }
.chain-head h4 { font-size: 21px; }
.chain-state { font-family: var(--font-bold); font-size: 16px; color: var(--teal-800); }
.chain-state.is-warn { color: #8f3418; }
.chain-legend { margin: 0 0 10px; font-size: 16px; color: var(--ink-soft); }
.chain { list-style: none; margin: 0; padding: 0; }
.node { display: grid; grid-template-columns: 56px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px; border-radius: 14px;
  background: #fff; border: 2px solid #b9d7cf; transition: border-color .4s, background-color .4s; }
.node-icon svg { display: block; width: 56px; height: 40px; transition: opacity .6s, filter .6s; }
.node-name { font-family: var(--font-bold); line-height: 1.25; }
.node-name small { display: block; font-family: var(--font-body); font-size: 16px; color: var(--ink-soft); }
.node-status { padding: 2px 10px; border-radius: 999px; background: #e3f2ee; color: var(--teal-800); font-family: var(--font-bold); font-size: 16px; white-space: nowrap; }
.node-bar { grid-column: 2 / -1; height: 8px; border-radius: 999px; background: #d8ebe6; overflow: hidden; }
.node-bar i { display: block; height: 100%; width: 50%; border-radius: inherit; background: var(--teal-600); transition: width .8s var(--ease); }
.node[data-tone="warn"] { border-color: var(--coral-700); background: #fff8f4; }
.node[data-tone="warn"] .node-status { background: #ffe6dc; color: #8f3418; }
.node[data-tone="warn"] .node-bar i { background: var(--coral-700); }
.node[data-tone="good"] { border-color: var(--teal-500); background: #f4fcf9; }
.node[data-state="down"] .node-icon svg { opacity: .55; }
.node[data-state="gone"] { border-style: dashed; border-color: #8a8f96; background: #f1f1f1; }
.node[data-state="gone"] .node-icon svg { opacity: .3; filter: grayscale(1); }
.node[data-state="gone"] .node-status { background: #e2e2e2; color: #333; }
.node[data-state="gone"] .node-bar i { background: #8a8f96; }
.node.is-shaking { animation: shake .65s ease-in-out; }
.node.is-glow { animation: glow 1.2s ease-in-out; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 15% { transform: translateX(-7px) rotate(-1.2deg); } 35% { transform: translateX(6px) rotate(1deg); } 55% { transform: translateX(-4px); } 75% { transform: translateX(3px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(42, 157, 143, 0); } 40% { box-shadow: 0 0 0 6px rgba(42, 157, 143, .35); } }
.link { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; color: var(--teal-800); font-size: 16px; }
.link svg { width: 22px; height: 28px; flex: none; }
.link .link-txt { font-family: var(--font-bold); }
.link.is-broken { color: #5b6068; }
.link.is-broken svg { opacity: .45; }
.chain-box.is-balanced .link svg { animation: flow 2.2s ease-in-out infinite; }
@keyframes flow { 0%, 100% { transform: translateY(2px); opacity: .75; } 50% { transform: translateY(-2px); opacity: 1; } }

.gauges { grid-area: gauges; display: grid; gap: 8px; padding: 12px 12px 14px; background: var(--navy-800); color: var(--on-dark); border-radius: 16px; }
.gauges-title { margin: 0; font-family: var(--font-bold); font-size: 16px; color: var(--on-dark-soft); }
.gauge { display: grid; grid-template-columns: 6.4em minmax(0, 1fr) 4.2em; gap: 2px 8px; align-items: center; }
.gauge-label .g-ico { display: none; }
.gauge-label { font-family: var(--font-bold); font-size: 16px; white-space: nowrap; }
.gauge-track { height: 12px; border-radius: 999px; overflow: hidden; }
.gauge-track i { display: block; height: 100%; width: 0; border-radius: inherit; transition: width .9s var(--ease); }
.gauge--safety .gauge-track { background: var(--g-safety-track); } .gauge--safety .gauge-track i { background: var(--g-safety); }
.gauge--eco .gauge-track { background: var(--g-eco-track); } .gauge--eco .gauge-track i { background: var(--g-eco); }
.gauge--shark .gauge-track { background: var(--g-shark-track); } .gauge--shark .gauge-track i { background: var(--g-shark); }
.gauge-num { display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.gauge-value { font-family: var(--font-bold); font-size: 18px; }
.gauge-delta { font-size: 16px; color: var(--on-dark-soft); min-width: 2.4em; text-align: right; }

.sim-result { margin-top: 16px; }
.sim-result h3 { font-size: clamp(21px, 3.2vw, 27px); margin-bottom: 8px; outline: none; }
.result-values { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; padding: 0; list-style: none; }
.result-values li { padding: 6px 12px; border-radius: 12px; background: var(--paper-2); border: 1px solid var(--sand-300); }
.reflection { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--teal-100); color: var(--teal-800); font-family: var(--font-bold); }
.result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.table-wrap { overflow-x: auto; margin-top: 14px; -webkit-overflow-scrolling: touch; }
.data-table { width: 100%; border-collapse: collapse; min-width: 420px; }
.data-table caption { text-align: left; font-family: var(--font-bold); margin-bottom: 6px; }
.data-table th, .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.data-table thead th { background: var(--paper-2); font-family: var(--font-bold); }
.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-bold); }
.sim-note { color: var(--on-dark-soft); margin: 14px 0 0; }
.sim-result .data-table { min-width: 0; }
.reflection.is-done { background: #fff1ea; color: #8f3418; }
.need-flash { animation: needFlash 1.6s ease; border-radius: 16px; }
@keyframes needFlash { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0); } 25%, 65% { box-shadow: 0 0 0 5px rgba(255, 209, 102, .95); } }
.q-panel, .sim, .sim-result, .panel, .field, fieldset, .choices { scroll-margin-top: 120px; }

/* ================================================================
   3단계: 나의 선택과 이유
   ================================================================ */
.frames { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
.frames-title { flex-basis: 100%; font-family: var(--font-bold); color: var(--teal-800); }
.frame-btn { min-height: 44px; padding: 6px 14px; border-radius: 12px; border: 2px dashed var(--teal-700); background: var(--teal-100); color: var(--teal-800); cursor: pointer; text-align: left; }
.frame-btn:hover { background: #c9ece6; }
.frame-btn.is-all { border-style: solid; font-family: var(--font-bold); }
.counter { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-top: 6px; color: var(--ink-soft); }
.counter .ok { color: var(--teal-800); font-family: var(--font-bold); }
.counter .need { color: #8f3418; font-family: var(--font-bold); }

/* ================================================================
   4단계: 공존의 의미
   ================================================================ */
.closing { display: grid; gap: 16px; align-items: center; }
.closing-bk { width: min(230px, 62vw); margin: 0 auto; }
.closing-bk svg { display: block; width: 100%; height: auto; }
.bubble { position: relative; background: #fff; border: 2px solid var(--sand-200); border-radius: 22px; padding: 18px 20px; }
.bubble::before { content: ''; position: absolute; left: 50%; top: -12px; width: 20px; height: 20px; margin-left: -10px; background: #fff;
  border-left: 2px solid var(--sand-200); border-top: 2px solid var(--sand-200); transform: rotate(45deg); }
.bubble-who { font-family: var(--font-bold); margin-bottom: 6px; }
.think { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: var(--teal-100); color: var(--teal-800); font-family: var(--font-bold); }
.meaning { margin-top: 16px; padding: clamp(18px, 3vw, 28px); border-radius: var(--radius-lg); color: #fff; box-shadow: var(--shadow);
  background: linear-gradient(135deg, var(--teal-700) 0%, var(--navy-700) 100%); }
.meaning h3 { font-size: clamp(24px, 4vw, 32px); color: #ffe9c7; }
.meaning-points { list-style: none; margin: 14px 0; padding: 0; display: grid; gap: 10px; }
.meaning-points li { padding: 14px 16px; border-radius: 16px; background: rgba(6, 20, 40, .28); border: 1px solid rgba(255, 255, 255, .18); }
.meaning-points .mp-icon { font-size: 26px; line-height: 1; }
.meaning-points .mp-title { display: block; font-family: var(--font-bold); font-size: 18px; margin: 6px 0 2px; color: #fff; }
.meaning-points .mp-text { color: #e4eef5; }
.meaning-def { margin: 0; padding: 14px 16px; border-radius: 16px; background: var(--paper); color: var(--ink); font-family: var(--font-bold); font-size: clamp(18px, 2.6vw, 22px); line-height: 1.55; }

/* ================================================================
   5단계: 활동 카드
   ================================================================ */
.card-stage { display: grid; justify-items: center; }
.activity-card { width: 100%; max-width: 700px; background: #fffaf1; color: var(--ink); border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); }
.ac-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 20px 22px; color: #fff; background: linear-gradient(135deg, #0b2545 0%, #0f6e70 100%); }
.ac-kicker { margin: 0; font-family: var(--font-bold); font-size: 16px; color: #bfe9e2; }
.ac-name { margin: 4px 0 2px; font-family: var(--font-title); font-size: clamp(24px, 4.6vw, 32px); color: #fff3dc; }
.ac-date { margin: 0; font-size: 16px; color: #d3e2ee; }
.ac-bk { width: clamp(96px, 22vw, 130px); }
.ac-bk svg { display: block; width: 100%; height: auto; }
.ac-body { display: grid; gap: 12px; padding: 18px 20px 6px; }
.ac-row { padding: 12px 14px; border-radius: 16px; background: #fff; border: 2px solid var(--sand-200); }
.ac-row h4 { margin: 0 0 6px; font-family: var(--font-bold); font-size: 16px; color: var(--teal-800); }
.ac-row p { margin: 0; }
.ac-grid2 { display: grid; gap: 12px; }
.ac-emos { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-family: var(--font-bold); }
.ac-emo { font-size: 28px; line-height: 1; }
.ac-arrow { color: var(--ink-mute); }
.ac-quote { margin-top: 8px !important; color: var(--ink-soft); }
.ac-choice { display: inline-block; padding: 4px 14px; border-radius: 999px; background: var(--coral-400); color: var(--ink); font-family: var(--font-title); font-size: 19px; }
.ac-small { margin-top: 6px !important; font-size: 16px; color: var(--ink-soft); }
.ac-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.ac-tag { padding: 3px 10px; border-radius: 999px; background: var(--teal-100); color: var(--teal-800); font-size: 16px; font-family: var(--font-bold); }
.ac-text { white-space: pre-wrap; }
.ac-meaning { background: #f2faf8; border-color: #cfe5df; }
.ac-pledge { background: #fff1ea; border-color: var(--coral-300); }
.ac-foot { margin: 0; padding: 12px 22px 18px; text-align: center; font-size: 16px; color: var(--ink-soft); }
.card-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
.card-help { text-align: center; color: var(--on-dark-soft); margin: 12px 0 0; }

/* ================================================================
   창(모달), 알림
   ================================================================ */
.modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(4, 14, 28, .7); }
.modal-box { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; overscroll-behavior: contain;
  padding: 20px; border-radius: 22px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); animation: pop .25s var(--ease); }
.modal-box--wide { width: min(1040px, 100%); }
.modal-box--sm { width: min(440px, 100%); }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.modal-head h2 { font-size: clamp(22px, 3.4vw, 28px); }
.close-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink); }
.close-btn:hover { background: var(--paper-2); }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.pw-error { min-height: 1.6em; margin: 8px 0 0; color: #9b2c12; font-family: var(--font-bold); }
.preview-img { display: block; width: 100%; height: auto; margin-top: 10px; border-radius: 14px; border: 1px solid var(--line); }
.text-out { width: 100%; min-height: 220px; margin-top: 10px; font-size: 16px; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 16px; }
.tab { min-height: 46px; padding: 8px 14px; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px; background: none; color: var(--ink-soft); font-family: var(--font-bold); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--coral-700); }
.tab:hover { color: var(--ink); }

.tp ul, .tp ol { padding-left: 1.3em; margin: 0; }
.tp li + li { margin-top: 4px; }
.tp small { font-size: 16px; color: var(--ink-soft); }
.notice { padding: 10px 14px; border-radius: 12px; background: #fff4d6; border: 1px solid #e6c46a; color: #5c4300; }
.notice + .notice { margin-top: 8px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }

.badge.is-no { background: #f0eee9; color: #55524b; border: 1px dashed #b5b0a5; }
.evidence { margin: 4px 0 0; font-size: 16px; color: var(--ink-soft); }
.summary-dl { display: grid; grid-template-columns: minmax(7em, max-content) 1fr; gap: 8px 14px; margin: 0; }
.summary-dl dt { font-family: var(--font-bold); color: var(--teal-800); }
.summary-dl dd { margin: 0; white-space: pre-wrap; }
.records { display: grid; gap: 10px; margin-top: 12px; }
.record { padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: #fff; }
.record-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.record-name { font-family: var(--font-bold); font-size: 18px; }
.record-meta { font-size: 16px; color: var(--ink-soft); }
.record-path { margin: 6px 0; }
.record details { margin-top: 8px; }
.record summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-family: var(--font-bold); color: var(--teal-800); }
.status-pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 16px; font-family: var(--font-bold); background: var(--sand-100); border: 1px solid var(--sand-300); }
.status-pill.is-done { background: var(--teal-100); border-color: #9fd6cc; color: var(--teal-800); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 260; max-width: min(520px, calc(100% - 32px));
  padding: 12px 18px; border-radius: 14px; background: var(--navy-800); color: #fff; border: 1px solid rgba(127, 209, 199, .4); box-shadow: var(--shadow);
  opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: opacity .25s, transform .25s; }
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

/* ================================================================
   SVG 움직임
   ================================================================ */
.a-float { animation: float 4.6s ease-in-out infinite; }
.a-tail { transform-box: fill-box; transform-origin: 100% 50%; animation: tail 1.8s ease-in-out infinite; }
.a-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5.5s ease-in-out infinite; }
.a-swim { animation: swim 7s ease-in-out infinite; }
.a-swim-l { animation: swimL 7s ease-in-out infinite; }
.a-glide { transform-box: fill-box; transform-origin: 50% 50%; animation: glide 3.4s ease-in-out infinite; }
.a-bob { animation: bob 3.2s ease-in-out infinite; }
.a-bubble { animation: bubble 6s linear infinite; }
.a-fall { animation: fall 2.6s linear infinite; }
.a-noise { transform-box: fill-box; transform-origin: 50% 50%; animation: noise .9s ease-in-out infinite; }
.a-ripple { transform-box: fill-box; transform-origin: 50% 50%; animation: ripple 2.4s ease-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes swim { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(16px); } }
@keyframes swimL { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-16px); } }
@keyframes glide { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.82); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@keyframes bubble { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-110px); opacity: 0; } }
@keyframes fall { from { transform: translateY(0); opacity: 1; } to { transform: translateY(120px); opacity: 0; } }
@keyframes noise { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@keyframes ripple { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }

/* 이미지 저장(캡처) 중에는 움직임을 멈춰 카드가 그대로 찍히게 함 */
.capturing *, .capturing *::before, .capturing *::after { animation: none !important; transition: none !important; }

/* ================================================================
   반응형: 태블릿(768px~), 데스크톱(1200px~)
   ================================================================ */
@media (min-width: 480px) {
  .gauge { grid-template-columns: 8.2em minmax(0, 1fr) 4.4em; }

  .steps { order: 3; flex-basis: 100%; }
  .teacher-btn { margin-left: auto; }
  .steps ol { gap: 6px; }
  .step-btn { justify-content: flex-start; padding: 5px 8px; }

  .progress-now { display: none; }
  main { padding: 26px 24px 64px; }
  .emo-grid { grid-template-columns: 1fr 1fr; }
  .choices { grid-template-columns: 1fr 1fr; }
  .choice { grid-template-columns: 1fr; }
  .gauges { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 14px 18px; }
  .gauges-title { grid-column: 1 / -1; }
  .gauge { grid-template-columns: minmax(0, 1fr) auto; }
  .gauge-track { grid-column: 1 / -1; grid-row: 2; }
  .closing { grid-template-columns: 220px 1fr; }
  .bubble::before { left: -12px; top: 50%; margin: -10px 0 0; border: 0; border-left: 2px solid var(--sand-200); border-bottom: 2px solid var(--sand-200); }
  .meaning-points { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .situation { grid-template-columns: 120px 1fr; }
  .situation-bk svg { width: 120px; }
  .dots { order: 0; flex-basis: auto; }
  .start-steps { grid-template-columns: 1fr; }
}
@media (min-width: 900px) {
  .start { grid-template-columns: 1.1fr .9fr; min-height: calc(100vh - 160px); }
  .slide { display: grid; grid-template-columns: 1.4fr 1fr; min-height: 440px; }
  .slide.slide--compare { display: block; min-height: 0; }
  .slide-scene { min-height: 100%; }
  .slide-scene > svg { position: absolute; inset: 0; height: 100%; }
  .slide-body { padding: 26px 26px 28px; align-self: center; }
  .compare-layout { grid-template-columns: 1.35fr 1fr; align-items: center; padding: 22px; }
  .choice { grid-template-columns: 92px 1fr; }
  .choice-icon svg { width: 92px; }
}
@media (min-width: 1000px) {
  .sim-body { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); grid-template-areas: "scene chain" "event chain" "gauges gauges"; }
}
@media (min-width: 1100px) {
  .topbar-inner { flex-wrap: nowrap; padding: 10px 16px; }
  .steps { order: 0; flex-basis: auto; }
  .teacher-btn { margin-left: 0; }
}
@media (min-width: 1200px) {
  body { font-size: 18px; }
  .step-name { font-size: 17px; }
}

/* 움직임 줄이기 설정 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }

@supports not (clip-path: inset(0 1px 0 0)) {

}

let uidN = 0;
const uid = (p) => p + '-' + (++uidN);
const r1 = (v) => Math.round(v * 10) / 10;
const SVG_FONT = "GangwonEdu_OTFBoldA, 'Malgun Gothic', sans-serif";
const SVG_TITLE_FONT = "GangwonEduPowerExtraBoldA, 'Malgun Gothic', sans-serif";

const MOOD_LABEL = { calm: '편안함', anxious: '불안', lonely: '외로움', relieved: '안도' };
const BK = { body: '#86b2d6', fin: '#6f9ec6', line: '#2c5476', belly: '#f7efe2', cheek: '#f49a85', ink: '#14253d', gill: '#5f8db3' };

/* ---------- 부캉이 (표정: calm 편안함 / anxious 불안 / lonely 외로움 / relieved 안도) ---------- */
function bukangiFace(mood) {
  const eye = (r, cy) => `<circle cx="184" cy="${cy}" r="${r}" fill="#fff" stroke="${BK.line}" stroke-width="2.5"/>`;
  const cheek = (op) => `<ellipse cx="174" cy="93" rx="8.5" ry="5" fill="${BK.cheek}" opacity="${op}"/>`;
  const line = `fill="none" stroke="${BK.ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
  if (mood === 'relieved') {
    return cheek(.85)
      + `<path d="M174 75Q184 63 194 75" ${line} stroke-width="3.5"/>`
      + `<path d="M194 95Q203 108 212 94Z" fill="#8a3b3b" stroke="${BK.ink}" stroke-width="2.5" stroke-linejoin="round"/>`
      + `<g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><path d="M221 96q7-5 14-1"/><path d="M223 105q6-2 11 1"/></g>`
      + `<path d="M200 18l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ffd166" stroke="#c98a1a" stroke-width="1"/>`
      + `<path d="M224 40l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#ffd166" stroke="#c98a1a" stroke-width="1"/>`;
  }
  if (mood === 'anxious') {
    return cheek(.35) + eye(12, 72)
      + `<circle cx="184" cy="74" r="4.6" fill="${BK.ink}"/><circle cx="185.6" cy="72.4" r="1.6" fill="#fff"/>`
      + `<path d="M171 56Q181 49 195 55" ${line}/>`
      + `<path d="M195 99q3.5-4.5 7 0t7 0" ${line}/>`
      + `<path d="M207 32q7 10 0 15q-7-5 0-15z" fill="#cfeaf7" stroke="${BK.gill}" stroke-width="2"/>`;
  }
  if (mood === 'lonely') {
    return cheek(.3) + eye(11, 73)
      + `<circle cx="183" cy="77.5" r="6" fill="${BK.ink}"/><circle cx="185" cy="75.5" r="1.8" fill="#fff"/>`
      + `<path d="M172.4 73A11.6 11.6 0 0 1 195.6 73Z" fill="${BK.body}"/>`
      + `<path d="M172 73.5Q184 77 196 73.5" ${line} stroke-width="2.6"/>`
      + `<path d="M182 87q-4.5 7 0 10.5q4.5-3.5 0-10.5z" fill="#a9dcf5" stroke="#4f86b5" stroke-width="1.5"/>`
      + `<path d="M196 101Q203 95.5 210 101" ${line}/>`;
  }
  return cheek(.7) + eye(11, 72)
    + `<circle cx="186.5" cy="73" r="6.5" fill="${BK.ink}"/><circle cx="189" cy="70" r="2.4" fill="#fff"/>`
    + `<path d="M195 97Q203 104 211 96" ${line}/>`;
}

function bukangiParts(mood) {
  const o = `stroke="${BK.line}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"`;
  const body = 'M52 84C60 52 98 36 142 38C184 40 214 62 216 86C218 110 186 126 144 128C100 130 62 116 52 84Z';
  return `<g class="a-tail"><path d="M66 78C50 66 32 50 14 42C14 60 22 76 34 86C22 96 14 110 14 128C32 120 50 104 66 92Z" fill="${BK.fin}" ${o}/></g>`
    + `<path d="M112 42C120 26 132 14 148 10C146 22 150 34 160 42Z" fill="${BK.fin}" ${o}/>`
    + `<path d="${body}" fill="${BK.body}"/>`
    + `<path d="M72 102C98 114 160 118 212 98C207 114 182 125 144 127C108 129 82 119 72 102Z" fill="${BK.belly}"/>`
    + `<ellipse cx="116" cy="56" rx="30" ry="8" fill="#ffffff" opacity=".22"/>`
    + `<path d="${body}" fill="none" ${o}/>`
    + `<g fill="none" stroke="${BK.gill}" stroke-width="2.5" stroke-linecap="round" opacity=".85"><path d="M148 74q-5 11 0 22"/><path d="M157 72q-5 12 0 25"/></g>`
    + `<path d="M132 110C128 124 118 136 104 142C120 146 140 136 152 116Z" fill="${BK.fin}" ${o}/>`
    + bukangiFace(MOOD_LABEL[mood] ? mood : 'calm');
}

/** 따로 쓰는 부캉이 그림. label 이 '' 이면 장식용(스크린리더에서 숨김) */
function bukangiSVG(mood, cls, label) {
  const m = MOOD_LABEL[mood] ? mood : 'calm';
  const aria = label === '' ? 'aria-hidden="true"' : `role="img" aria-label="${esc(label || '부캉이 (' + MOOD_LABEL[m] + ')')}"`;
  return `<svg class="bk ${cls || ''}" viewBox="0 0 240 160" ${aria} focusable="false"><g class="a-float">${bukangiParts(m)}</g></svg>`;
}

/** 장면 속 부캉이 (x, y: 왼쪽 위, s: 크기) */
function bukangiAt(x, y, s, mood, opt) {
  opt = opt || {};
  const t = opt.flip ? `translate(${r1(x + 240 * s)} ${y}) scale(${-s} ${s})` : `translate(${x} ${y}) scale(${s})`;
  return `<g transform="${t}"><g${opt.still ? '' : ' class="a-float"'}>${bukangiParts(mood)}</g></g>`;
}

/* ---------- 작은 그림 조각 ---------- */
const lg = (id, stops) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map((s) => `<stop offset="${s[0]}" stop-color="${s[1]}"/>`).join('')}</linearGradient>`;

const fish = (x, y, s, c, flip) => `<g transform="translate(${r1(x)} ${r1(y)}) scale(${flip ? -s : s} ${s})"><path d="M-11 0C-5-7 7-7 11 0C7 7-5 7-11 0Z" fill="${c}"/><path d="M-10 0L-18-6V6Z" fill="${c}"/><circle cx="5" cy="-1.5" r="1.6" fill="#13253d"/></g>`;

function school(x, y, n, c, flip, s) {
  s = s || 1;
  const offs = [[0, 0], [20, -11], [22, 11], [42, 0], [-18, 12], [-20, -12]];
  let out = '';
  for (let i = 0; i < n; i++) {
    const o = offs[i % offs.length];
    out += fish(x + (flip ? -o[0] : o[0]) * s, y + o[1] * s, s * (i % 2 ? .85 : 1), c, flip);
  }
  return `<g class="${flip ? 'a-swim-l' : 'a-swim'}" style="animation-delay:-${(x % 7).toFixed(1)}s">${out}</g>`;
}

function kelp(x, base, h, c, d) {
  const k1 = r1(base - h * .42), k2 = r1(base - h * .7);
  return `<g class="a-sway" style="animation-delay:${d || 0}s"><path d="M${x} ${base}C${x - 14} ${r1(base - h * .3)} ${x + 14} ${r1(base - h * .62)} ${x} ${base - h}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round"/>`
    + `<ellipse cx="${x - 8}" cy="${k1}" rx="10" ry="4.5" fill="${c}" transform="rotate(-30 ${x - 8} ${k1})"/>`
    + `<ellipse cx="${x + 8}" cy="${k2}" rx="10" ry="4.5" fill="${c}" transform="rotate(30 ${x + 8} ${k2})"/></g>`;

/** 받침에 맞는 조사 붙이기: josa('공존', '을/를') → '공존을' */
function josa(word, pair) {
  word = String(word);
  if (pair.indexOf('/') < 0) return word + pair;
  const p = pair.split('/');
  const code = word.charCodeAt(word.length - 1);
  if (!(code >= 0xAC00 && code <= 0xD7A3)) return word + p[0];
  const jong = (code - 0xAC00) % 28;
  if (p[0] === '으로') return word + (jong && jong !== 8 ? '으로' : '로');
  return word + (jong ? p[0] : p[1]);
}
/** {park} {village:은/는} 같은 표시를 실제 이름으로 바꾸기 */
function fill(text, extra) {
  const dict = Object.assign({}, CONTENT.place, extra || {});
  return String(text == null ? '' : text).replace(/\{(\w+)(?::([^}]+))?\}/g, (m, key, pair) => {
    if (!Object.prototype.hasOwnProperty.call(dict, key)) return m;
    return pair ? josa(dict[key], pair) : dict[key];
  });
}

let storageOK = true;
const memStore = {};
const storage = {
  get(key, fallback) {
    let raw = null;
    try { raw = window.localStorage.getItem(key); } catch (e) { storageOK = false; }
    if (raw != null) { try { return JSON.parse(raw); } catch (e) { /* 깨진 값은 무시 */ } }
    return Object.prototype.hasOwnProperty.call(memStore, key) ? memStore[key] : fallback;
  },
  set(key, val) {
    memStore[key] = val;
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { storageOK = false; return false; }
  },
  remove(key) {
    delete memStore[key];
    try { window.localStorage.removeItem(key); } catch (e) { storageOK = false; }
  }
};

  };

function loadState() {
  const base = newState();
  const saved = storage.get(STORE_KEY, null);
  if (!saved || typeof saved !== 'object' || saved.v !== 1) return base;
  const s = Object.assign(base, saved);
  ['id', 'name', 'emoBefore', 'emoAfter', 'q1', 'simFirst', 'simCurrent', 'finalChoice', 'tagEtc', 'reason', 'q2', 'pledge', 'pledgeCustom', 'startedAt', 'finishedAt', 'updatedAt']
    .forEach((k) => { if (typeof s[k] !== 'string') s[k] = base[k]; });
  if (!Array.isArray(s.tags)) s.tags = [];
  if (!Array.isArray(s.storySeen)) s.storySeen = [];
  if (!s.simViewed || typeof s.simViewed !== 'object') s.simViewed = { capture: false, coexist: false };
  if (!CONTENT.sim.scenarios[s.simCurrent]) s.simCurrent = '';
  if (!CONTENT.sim.scenarios[s.simFirst]) s.simFirst = '';
  if (!CONTENT.sim.scenarios[s.finalChoice]) s.finalChoice = '';

}

function toSec(t) { const m = /(\d+)\s*분/.exec(t || ''), s = /(\d+)\s*초/.exec(t || ''); return (m ? +m[1] * 60 : 0) + (s ? +s[1] : 0); }
function fmtSec(sec) { const m = Math.floor(sec / 60), s = sec % 60; return ((m ? m + '분' : '') + (m && s ? ' ' : '') + (s ? s + '초' : '')) || '0분'; }

const pad2 = (n) => String(n).padStart(2, '0');
function fmtDate(iso, withTime) {

  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.` + (withTime ? ` ${pad2(d.getHours())}:${pad2(d.getMinutes())}` : '');
}

function updateProgress() {
  const n = state.screen;
  $$('.step-btn').forEach((b) => {
    const i = Number(b.dataset.step);
    const done = state.maxScreen > i || (i === 5 && !!state.finishedAt);
    const locked = i > state.maxScreen;
    b.classList.toggle('is-done', done && i !== n);
    b.classList.toggle('is-current', i === n);
    b.setAttribute('aria-disabled', locked ? 'true' : 'false');
    if (i === n) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    $('.step-num', b).textContent = done && i !== n ? '✓' : String(i);
    $('.step-sr', b).textContent = `${i}단계 ${CONTENT.stages[i].title}, 권장 ${STAGE_TIMES[i]}${i === n ? ', 지금 단계' : done ? ', 완료' : locked ? ', 아직 열리지 않음' : ''}`;
  });
  $('#progress-now').innerHTML = n === 0
    ? `총 5단계 · ⏱ 약 ${esc(totalTimeText())}`
    : `<b>${n}단계 · ${esc(CONTENT.stages[n].title)}</b> · ⏱ 권장 ${esc(STAGE_TIMES[n])}`;
  const doneCount = state.finishedAt ? 5 : Math.max(0, state.maxScreen - 1);

  $$('.screen').forEach((sc) => {
    const on = Number(sc.dataset.screen) === n;
    sc.hidden = !on;
    sc.classList.remove('is-entering', 'from-back');
    if (on && opt.animate !== false && !prefersReduced()) {
      void sc.offsetWidth;
      sc.classList.add('is-entering');
      if (n < prev) sc.classList.add('from-back');
    }
  });
  $$('.nav-hint').forEach((h) => { h.textContent = ''; });
  $('#toast').classList.remove('is-show');
  onEnter(n);
  updateProgress();
  if (opt.scroll !== false) window.scrollTo(0, 0);
  if (opt.focus !== false) {
    const h = $('#screen-' + n + ' [tabindex="-1"]');
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
  }
  saveSoon();
}

function onEnter(n) {
  if (n === 0) renderStart();
  if (n === 1) { goSlide(state.storyIndex, { instant: true, silent: true }); requestAnimationFrame(syncStoryHeight); }
  if (n === 2) renderSimOnEnter();
  if (n === 3) { updateFrameLabels(); updateCounter(); }
  if (n === 4) renderClosing();
  if (n === 5) {
    if (!state.finishedAt) state.finishedAt = new Date().toISOString();
    renderCard();
    saveNow();
  }
}

/** 다음 단계로 가기 전에 빠진 것을 확인 */
function validateStage(n) {
  const R = CONTENT.rules;
  const len = (t) => String(t || '').trim().length;
  if (n === 1) {
    if (!state.storyDone) return { msg: '이야기 카드를 끝까지 넘겨 보세요.', focus: '#story-next' };
    if (!state.emoBefore) return { msg: '매립 전 부캉이의 마음을 골라 주세요.', focus: 'input[name="emo-before"]' };
    if (!state.emoAfter) return { msg: '매립 후 부캉이의 마음을 골라 주세요.', focus: 'input[name="emo-after"]' };
    if (len(state.q1) < R.q1Min) return { msg: `부캉이에게 바다는 어떤 곳이었는지 한 줄(${R.q1Min}자 이상)로 써 주세요.`, focus: '#q1-text' };
  }
  if (n === 2) {
    if (!state.simViewed.capture && !state.simViewed.coexist) {
      if (sim.key) return { msg: '5년차까지 변화를 살펴본 뒤 다음 단계로 갈 수 있어요.', focus: '#sim-next' };
      return { msg: '선택 카드를 하나 골라 5년 동안의 변화를 살펴보세요.', focus: '.choice-btn' };
    }
  }
  if (n === 3) {
    if (!state.finalChoice) return { msg: '나의 최종 선택을 골라 주세요.', focus: 'input[name="final-choice"]' };
    if (!state.tags.length) return { msg: '내가 고려한 것을 하나 이상 골라 주세요.', focus: 'input[name="tags"]' };
    if (state.tags.indexOf('etc') >= 0 && !state.tagEtc.trim()) return { msg: '‘기타’에 내가 고려한 것을 적어 주세요.', focus: '#tag-etc' };
    if (/_{3,}/.test(state.reason)) return { msg: '이유에 남아 있는 빈칸(___)을 내 생각으로 바꿔 주세요.', focus: '#reason' };
    if (reasonLength(state.reason) < R.reasonMin) return { msg: `이유를 ${R.reasonMin}자 이상 써 주세요. (지금 ${reasonLength(state.reason)}자)`, focus: '#reason' };
  }
  if (n === 4) {
    if (len(state.q2) < R.q2Min) return { msg: `발문 2에 대한 생각을 한 문장(${R.q2Min}자 이상)으로 써 주세요.`, focus: '#q2-text' };
    if (!state.pledge) return { msg: '공존을 위해 내가 할 수 있는 일을 하나 골라 주세요.', focus: 'input[name="pledge"]' };
    if (state.pledge === '__custom__' && len(state.pledgeCustom) < 2) return { msg: '나의 다짐을 직접 써 주세요.', focus: '#pledge-custom' };
  }
  return null;
}
function tryNext(n) {
  const err = validateStage(n);
  const hint = $('#screen-' + n + ' .nav-hint');
  if (!err) { if (hint) hint.textContent = ''; goTo(n + 1); return; }
  if (hint) hint.textContent = '⚠️ ' + err.msg;
  toast(err.msg);
  const f = err.focus ? $('#screen-' + n + ' ' + err.focus) : null;
  if (f) {
    const box = f.closest('.field, fieldset, .carousel-controls, .sim-top, .choices') || f;
    flash(box);
    try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); }
    box.scrollIntoView({ behavior: smooth(), block: 'center' });
  }
}

function buildStory() {

function syncStoryHeight() {
  const vp = $('#story-viewport');
  const s = $$('.slide', vp)[state.storyIndex];
  if (!s || $('#screen-1').hidden) return;
  vp.style.height = s.offsetHeight + 'px';
}

function goSlide(i, opt) {
  opt = opt || {};
  i = clamp(i, 0, SLIDES.length - 1);
  state.storyIndex = i;
  state.storySeen[i] = true;
  const track = $('#story-track');
  if (opt.instant) track.style.transition = 'none';
  track.style.transform = `translateX(${-i * 100}%)`;
  if (opt.instant) { void track.offsetWidth; track.style.transition = ''; }
  $$('.slide', track).forEach((s, k) => {
    const on = k === i;
    s.classList.toggle('is-active', on);
    s.setAttribute('aria-hidden', on ? 'false' : 'true');
    if ('inert' in s) s.inert = !on;
  });
  $('#compare-handle').setAttribute('tabindex', i === COMPARE_INDEX ? '0' : '-1');
  $$('.dot').forEach((d, k) => {
    d.classList.toggle('is-seen', !!state.storySeen[k]);
    if (k === i) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current');
  });
  $('#story-prev').setAttribute('aria-disabled', i === 0 ? 'true' : 'false');
  const last = i === SLIDES.length - 1;
  $('#story-next').innerHTML = last ? '생각 나누기 <span aria-hidden="true">✍️</span>' : '다음 카드 <span aria-hidden="true">▶</span>';
  if (last && !state.storyDone) { state.storyDone = true; showQ1(false); }
  $('#screen-1 [data-next]').hidden = !state.storyDone;
  if (!opt.silent) $('#story-live').textContent = `${i + 1}번째 카드 / 전체 ${SLIDES.length}장: ${stripTags(fill(SLIDES[i].title))}`;
  syncStoryHeight();
  if (!opt.silent) {
    saveSoon();
    const top = $('#story-viewport').getBoundingClientRect().top, headH = $('.topbar').offsetHeight;
    if (!opt.instant && top < headH) window.scrollBy({ top: top - headH - 12, behavior: smooth() });
  }
}

function initSwipe() {
  const vp = $('#story-viewport'), track = $('#story-track');
  let sw = null;
  vp.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.compare, button, a, input, textarea')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    sw = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, active: false };
  });
  vp.addEventListener('pointermove', (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.active) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        sw.active = true;
        try { vp.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
        track.classList.add('is-dragging');
      } else if (Math.abs(dy) > 12) { sw = null; return; } else return;
    }
    const atEdge = (state.storyIndex === 0 && dx > 0) || (state.storyIndex === SLIDES.length - 1 && dx < 0);
    sw.dx = atEdge ? dx / 3 : dx;
    track.style.transform = `translateX(calc(${-state.storyIndex * 100}% + ${Math.round(sw.dx)}px))`;
  });
  const end = (e) => {
    if (!sw || (e && e.pointerId !== sw.id)) return;
    const s = sw;
    sw = null;
    track.classList.remove('is-dragging');
    if (!s.active) return;
    const lim = Math.min(70, vp.clientWidth * .18);
    if (s.dx < -lim) goSlide(state.storyIndex + 1);
    else if (s.dx > lim) goSlide(state.storyIndex - 1);
    else goSlide(state.storyIndex, { silent: true });
  };
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);
}

let compareMood = '';
function setComparePos(p, user) {
  const c = CONTENT.story.compare;
  p = clamp(Math.round(p), 0, 100);
  const box = $('#compare');
  if (!box) return;
  box.style.setProperty('--pos', p + '%');
  const h = $('#compare-handle');
  h.setAttribute('aria-valuenow', String(p));
  h.setAttribute('aria-valuetext', `${c.beforeLabel} ${p}%, ${c.afterLabel} ${100 - p}% 보임`);
  c.indicators.forEach((d, k) => {
    const v = d.after + (d.before - d.after) * p / 100;
    $('#ind-word-' + k).textContent = d.words[v < 34 ? 0 : v < 67 ? 1 : 2];
    $('#ind-bar-' + k).style.width = Math.round(v) + '%';
  });
  const mood = p >= 50 ? 'calm' : 'lonely';
  if (mood !== compareMood) {
    compareMood = mood;
    $('#compare-avatar').innerHTML = bukangiSVG(mood, 'bk-mini', '');
  }
  $('#compare-ratio').textContent = `지금 보이는 바다 → ${c.beforeLabel} ${p}% · ${c.afterLabel} ${100 - p}%`;
  if (user) {
    state.sliderPos = p;
    if (!state.sliderMoved) { state.sliderMoved = true; $('#compare-hint').hidden = true; }
    saveSoon();
  }
}
function initCompare() {
  const box = $('#compare'), handle = $('#compare-handle');
  let drag = null;
  const posOf = (e) => { const r = box.getBoundingClientRect(); return (e.clientX - r.left) / r.width * 100; };
  box.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const onHandle = !!e.target.closest('.compare-handle');
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, active: onHandle || e.pointerType === 'mouse' };
    if (drag.active) {
      try { box.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
      setComparePos(posOf(e), true);
      e.preventDefault();
    }
  });
  box.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.active) {
      const dx = Math.abs(e.clientX - drag.x), dy = Math.abs(e.clientY - drag.y);
      if (dx > 6 && dx > dy) {
        drag.active = true;
        try { box.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
      } else if (dy > 10) { drag = null; return; } else return;
    }
    setComparePos(posOf(e), true);
  });
  box.addEventListener('pointerup', (e) => {
    if (drag && !drag.active && e.pointerId === drag.id) setComparePos(posOf(e), true);
    drag = null;
  });
  box.addEventListener('pointercancel', () => { drag = null; });
  handle.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5, PageDown: -20, PageUp: 20 };
    let p = null;
    if (Object.prototype.hasOwnProperty.call(map, e.key)) p = state.sliderPos + map[e.key];
    else if (e.key === 'Home') p = 0;
    else if (e.key === 'End') p = 100;
    if (p !== null) { e.preventDefault(); e.stopPropagation(); setComparePos(p, true); }
  });
}

const yearData = (key, y) => (y === 0 ? CONTENT.sim.start : CONTENT.sim.scenarios[key].years[y - 1]);
const levelWord = (v) => (v >= 67 ? '많음' : v >= 34 ? '보통' : v >= 15 ? '적음' : '거의 없음');

function chooseScenario(key, opt) {
  opt = opt || {};
  const c = CONTENT.sim.scenarios[key];
  if (!c) return;
  simPause();
  if (!state.simFirst) state.simFirst = key;
  state.simCurrent = key;
  sim.key = key;
  $$('.choice').forEach((el) => {
    const on = el.dataset.choice === key;
    el.classList.toggle('is-selected', on);
    $('.choice-btn', el).setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  $('#sim').hidden = false;
  $('#sim-title').innerHTML = `<span class="choice-letter" aria-hidden="true">${esc(c.letter)}</span>${esc(josa(c.title, '을/를'))} 골랐을 때, 5년 동안의 변화`;
  $('#sim-result').hidden = true;
  const startYear = opt.year != null ? opt.year : 0;
  sim.year = startYear;
  setYear(startYear, { instant: true });
  if (opt.scroll !== false) {
    $('#sim').scrollIntoView({ behavior: smooth(), block: 'start' });
    try { $('#sim-title').focus({ preventScroll: true }); } catch (e) { $('#sim-title').focus(); }
  }
  if (opt.autoplay !== false && !prefersReduced()) simPlay();
  saveSoon();
}

function setYear(y, opt) {
  opt = opt || {};
  if (!sim.key) return;
  const prevY = sim.year;
  y = clamp(y, 0, 5);
  sim.year = y;
  const d = yearData(sim.key, y), prev = y > 0 ? yearData(sim.key, y - 1) : null;
  $$('.year-btn').forEach((b) => {
    const yy = Number(b.dataset.year);
    b.classList.toggle('is-done', yy < y);
    if (yy === y) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  $('#sim-stamp').textContent = yearName(y);
  const ev = $('#sim-event');
  ev.innerHTML = `<h4>${y === 0 ? fill(d.title) : `${yearName(y)} · ${fill(d.title)}`}</h4><p class="ev-text">${fill(d.text)}</p>`
    + (d.say ? `<p class="voice"><span class="voice-who">${esc(d.who || '')}</span><q>${fill(d.say)}</q></p>` : '');
  if (!opt.instant) { ev.classList.remove('is-new'); void ev.offsetWidth; ev.classList.add('is-new'); }
  updateGauges(d, prev);
  updateScene(d, y);
  updateChain(d, !opt.instant && y > prevY);
  $('#sim-prev').setAttribute('aria-disabled', y === 0 ? 'true' : 'false');
  $('#sim-next').setAttribute('aria-disabled', y === 5 ? 'true' : 'false');
  if (y === 5) markViewed(sim.key, !!opt.fromPlay);
  updatePlayBtn();
}

function updateGauges(d, prev) {
  CONTENT.sim.gauges.forEach((g) => {
    const el = $(`.gauge[data-g="${g.key}"]`);
    if (!el) return;
    const v = clamp(Math.round(d.gauges[g.key] || 0), 0, 100);
    const pv = prev ? clamp(Math.round(prev.gauges[g.key] || 0), 0, 100) : null;
    const diff = pv == null ? 0 : v - pv;
    $('.gauge-track i', el).style.width = v + '%';
    $('.gauge-value', el).textContent = String(v);
    $('.gauge-delta', el).textContent = pv == null ? '' : diff > 0 ? `▲${diff}` : diff < 0 ? `▼${-diff}` : '–';
    el.setAttribute('aria-valuenow', String(v));
    el.setAttribute('aria-valuetext', `${v}점` + (pv == null ? '' : diff > 0 ? `, 지난해보다 ${diff}점 올라감` : diff < 0 ? `, 지난해보다 ${-diff}점 내려감` : ', 지난해와 같음'));
  });
}

function updateScene(d, y) {
  const svg = $('#sim-svg');
  if (!svg) return;
  const sc = d.scene || {}, p = d.pop, sl = SIM_SLOTS;
  const counts = {
    people: sc.people || 0,
    signs: sc.signs ? 1 : 0, zones: sc.zones ? 1 : 0, restore: sc.restore ? 1 : 0, edu: sc.edu ? 1 : 0,
    boat: sc.boat && sc.boat !== 'none' ? 1 : 0,
    'boat-net': sc.boat === 'net' ? 1 : 0, 'boat-empty': sc.boat === 'empty' ? 1 : 0, 'boat-full': sc.boat === 'full' ? 1 : 0,
    seaweed: Math.round(p.seaweed / 100 * sl.seaweed.length),
    shells: Math.round(p.small / 100 * sl.shells.length),
    small: Math.round(p.small / 100 * sl.schools.length),
    mid: Math.round(p.mid / 100 * sl.mids.length),
    shark: p.shark >= 30 ? 1 : 0
  };
  $$('.si', svg).forEach((el) => { el.classList.toggle('off', !(Number(el.dataset.i) < (counts[el.dataset.k] || 0))); });
  const mood = d.mood || 'anxious';
  if (mood !== sim.sharkMood) { sim.sharkMood = mood; $('#sim-shark').innerHTML = simSharkInner(mood); }
  $('#sim-murk').style.opacity = (clamp((70 - d.gauges.eco) / 50, 0, 1) * .5).toFixed(2);
  svg.setAttribute('aria-label', `${yearName(y)} 바닷속 모습: 상어 ${p.shark >= 30 ? '있음' : '없음'}, 가오리·큰 물고기 ${levelWord(p.mid)}, 작은 물고기·조개 ${levelWord(p.small)}, 해조류 ${levelWord(p.seaweed)}`);
}

function chainStateOf(v, base) {
  if (v < 15) return 'gone';
  if (v - base >= 12) return 'up';
  if (base - v >= 12) return 'down';
  return 'same';
}
function updateChain(d, animate) {
  const C = CONTENT.sim.chain, base = CONTENT.sim.start.pop;
  const nodes = $$('#chain-box .node');
  let first = -1, warn = false;
  const states = C.nodes.map((n, i) => {
    const v = d.pop[n.key] || 0, st = chainStateOf(v, base[n.key] || 0);
    const tone = st === 'gone' || st === 'down' || (st === 'up' && n.upIsWarning) ? 'warn' : st === 'up' ? 'good' : 'neutral';
    const el = nodes[i];
    if (el.dataset.state !== st && first < 0) first = i;
    if (tone === 'warn') warn = true;
    el.dataset.state = st;
    el.dataset.tone = tone;
    $('.node-status', el).textContent = C.status[st];
    $('.node-bar i', el).style.width = clamp(v, 0, 100) + '%';
    return { st: st, tone: tone };
  });
  $$('#chain-box .link').forEach((l) => {
    const i = Number(l.dataset.link);
    const broken = states[i].st === 'gone' || states[i + 1].st === 'gone';
    l.classList.toggle('is-broken', broken);
    $('.link-txt', l).textContent = broken ? C.brokenText : C.linkText;
  });
  $('#chain-box').classList.toggle('is-balanced', !warn);
  const cs = $('#chain-state');
  cs.textContent = warn ? C.shaky : C.balanced;
  cs.classList.toggle('is-warn', warn);
  if (animate && first >= 0 && !prefersReduced()) {
    const cls = states[first].tone === 'good' ? 'is-glow' : 'is-shaking';
    for (let k = first; k < nodes.length; k++) {
      const el = nodes[k];
      setTimeout(() => { el.classList.remove('is-shaking', 'is-glow'); void el.offsetWidth; el.classList.add(cls); }, (k - first) * 260);
    }
  }
}

function simPlay() {
  if (!sim.key) return;
  if (sim.year >= 5) setYear(0, { instant: true });
  sim.playing = true;
  updatePlayBtn();
  scheduleNext();
}
function scheduleNext() {
  clearTimeout(sim.timer);
  if (!sim.playing) return;
  if (sim.year >= 5) { simPause(); return; }
  const ms = Math.max(1200, Number(CONTENT.rules.simYearSeconds) * 1000 * (sim.year === 0 ? .6 : 1) || 4500);
  $$('.year-btn .yp').forEach((b) => { b.style.transition = 'none'; b.style.width = '0'; });
  const bar = $(`.year-btn[data-year="${sim.year + 1}"] .yp`);
  if (bar) { void bar.offsetWidth; bar.style.transition = `width ${ms}ms linear`; bar.style.width = '100%'; }
  sim.timer = setTimeout(() => {
    if (!sim.playing) return;
    setYear(sim.year + 1, { fromPlay: true });
    if (sim.year < 5) scheduleNext(); else simPause();
  }, ms);
}
function simPause() {
  sim.playing = false;
  clearTimeout(sim.timer);
  $$('.year-btn .yp').forEach((b) => { b.style.transition = 'none'; b.style.width = '0'; });
  updatePlayBtn();
}
function updatePlayBtn() {
  const b = $('#sim-play');
  if (!b) return;
  b.innerHTML = ctlIcon(sim.playing ? 'pause' : 'play');
  b.setAttribute('aria-label', sim.playing ? '일시 정지' : sim.year >= 5 ? '처음부터 자동 재생' : '자동 재생');
}

function markViewed(key, scroll) {
  if (!state.simViewed[key]) { state.simViewed[key] = true; saveSoon(); }
  $$('.choice').forEach((el) => { $('.choice-seen', el).hidden = !state.simViewed[el.dataset.choice]; });
  showResult(scroll);
}
function showResult(scroll) {
  const S = CONTENT.sim, key = sim.key, c = S.scenarios[key];
  const other = key === 'capture' ? 'coexist' : 'capture', oc = S.scenarios[other];
  const last = c.years[c.years.length - 1];
  const both = state.simViewed.capture && state.simViewed.coexist;
  let html = `<h3 id="sim-result-title" tabindex="-1">${esc(fill(S.resultTitle, { choice: c.letter + ' ' + c.title }))}</h3><p>${fill(c.result)}</p>`
    + `<ul class="result-values" aria-label="5년 뒤 지표">${S.gauges.map((g) => `<li><span aria-hidden="true">${g.icon}</span> ${esc(g.label)} <b>${last.gauges[g.key]}</b>점</li>`).join('')}</ul>`
    + `<p class="reflection">💭 ${fill(S.reflection)}</p>`;
  if (both) {
    const lc = S.scenarios.capture.years[S.scenarios.capture.years.length - 1];
    const lo = S.scenarios.coexist.years[S.scenarios.coexist.years.length - 1];
    html += `<div class="table-wrap"><table class="data-table"><caption>${esc(S.compareTitle)}</caption>`
      + `<thead><tr><th scope="col">지표</th><th scope="col">${esc(choiceName('capture'))}</th><th scope="col">${esc(choiceName('coexist'))}</th></tr></thead><tbody>`
      + S.gauges.map((g) => `<tr><th scope="row"><span aria-hidden="true">${g.icon}</span> ${esc(g.label)}</th><td class="num">${lc.gauges[g.key]}</td><td class="num">${lo.gauges[g.key]}</td></tr>`).join('')
      + `</tbody></table></div><p class="reflection is-done">${fill(S.bothDone)}</p>`;
  }
  html += `<div class="result-actions"><button type="button" class="btn btn-secondary" data-other="${other}"><span aria-hidden="true">🔁</span> ${esc(S.otherButton)}: ${esc(choiceName(other))}</button>`
    + `<button type="button" class="btn btn-primary" data-go-next>다음 단계로 <span aria-hidden="true">▶</span></button></div>`;
  const box = $('#sim-result');
  box.innerHTML = html;
  box.hidden = false;
  if (scroll) setTimeout(() => box.scrollIntoView({ behavior: smooth(), block: 'nearest' }), 400);
}

function renderSimOnEnter() {
  $$('.choice').forEach((el) => { $('.choice-seen', el).hidden = !state.simViewed[el.dataset.choice]; });
  if (state.simCurrent && sim.key !== state.simCurrent) {
    chooseScenario(state.simCurrent, { autoplay: false, scroll: false, year: state.simViewed[state.simCurrent] ? 5 : 0 });
  }
}
